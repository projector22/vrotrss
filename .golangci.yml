version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-return
        - name: error-naming
        - name: var-naming
        - name: indent-error-flow
        - name: unused-parameter
    gocritic:
      enabled-tags: [diagnostic, style]
      disabled-checks: [ifElseChain]
    nolintlint:
      require-specific: true
      require-explanation: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, unparam]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/projector22/vrotrss
