name: release

# Push a tag like v0.1.0 (see `make tag`) to test, build and publish a release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: build and publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid version (expected v1.2.3 or v1.2.3-rc.1)"
            exit 1
          fi

      - name: Build release archives
        env:
          TAG: ${{ github.ref_name }}
        run: make dist VERSION="$TAG"

      - name: Smoke-test the linux/amd64 binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tar -xzf "dist/vrotrss_${TAG}_linux_amd64.tar.gz" -C /tmp
          out="$("/tmp/vrotrss_${TAG}_linux_amd64/vrot" -version)"
          echo "$out"
          [[ "$out" == "vrot ${TAG} "* ]] || { echo "::error::binary reports wrong version"; exit 1; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--title "$TAG" --generate-notes --verify-tag)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS "${flags[@]}"
